# This workflow only actually runs once/if this repository is pushed to a GitHub remote.
#
# Unit/type-check CI only: this intentionally does NOT run the Playwright end-to-end
# suite (npm run test:e2e), since it needs a real browser and a real Windows launch
# environment beyond what a hosted runner offers. Browser e2e coverage is run
# separately/locally for now.
#
# Runner is windows-latest, not ubuntu-latest: Agent Town is a Windows-only local app
# (per AGENTS.md/CLAUDE.md), and several unit tests intentionally verify real Windows
# filesystem semantics (e.g. the read-only file attribute blocking a rename) that a
# Linux runner cannot reproduce and were never meant to run there.
#
# The build step matters, not just the type-check: several observation/tool-detection
# tests need the real service build output (apps/service/dist/hook-bridge.cjs) to exist
# — it is gitignored, so a fresh checkout has none until this step creates it. Without
# it, those tests get a real "not built on this computer" refusal instead of exercising
# the behavior under test.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      # GitHub's hosted windows-latest image places the runneradmin profile's %TEMP% under a
      # junction onto the D: scratch disk. Node's os.tmpdir() (and every test fixture that calls
      # it) inherits that path, and this app's own path-safety check (checkedPath/canonicalizeRoot
      # in apps/service/src/discovery/paths.ts) deliberately walks and refuses every symlinked path
      # component — correct behavior for a real user-chosen project folder, but it means almost
      # every fixture that scratches under the default temp dir gets refused as "unsafe-root" on
      # this specific hosted image, not on a real end-user Windows machine. Fix: point TEMP/TMP at
      # RUNNER_TEMP directly (GitHub's own documented, already-real, non-junctioned scratch dir on
      # D:, always set as a plain env var — no expression-context restrictions) via $GITHUB_ENV, so
      # every later step (including npm test) sees os.tmpdir() resolve there with a clean ancestor
      # chain instead of through the junction. Also prints the reparse-point chain for visibility.
      - name: Point TEMP/TMP at the runner's own non-junctioned scratch directory
        shell: pwsh
        run: |
          Write-Host "Before: env:TEMP = $env:TEMP"
          $path = $env:TEMP
          while ($path) {
            $item = Get-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            if ($item) { Write-Host "$path -> Attributes=$($item.Attributes) LinkType=$($item.LinkType) Target=$($item.Target)" }
            $parent = Split-Path -Path $path -Parent
            if ($parent -eq $path) { break }
            $path = $parent
          }
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "After (next steps only): TEMP/TMP = $env:RUNNER_TEMP"
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
